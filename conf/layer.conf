BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-pgo"
BBFILE_PATTERN_meta-pgo = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-pgo = "6"

LAYERSERIES_COMPAT_meta-pgo = "wrynose blacksail"
LAYERDEPENDS_meta-pgo = "core"
