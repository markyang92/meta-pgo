BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-pgo"
BBFILE_PATTERN_meta-pgo = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-pgo = "6"

LAYERSERIES_COMPAT_meta-pgo = "wrynose blacksail"
LAYERDEPENDS_meta-pgo = "core"

# Freeze dependencies so clang-native, llvm-native reuse clang.profdata
# from the existing sstate instead of rebuilding whenever the LLVM source changes.
# Profile data is not sensitive to source changes.
LLVMVERSION = "22.1.8"
SIGGEN_EXCLUDE_SAFE_RECIPE_DEPS += "\
    clang-profdata-native->llvm-project-source-${LLVMVERSION} \
    clang-profdata-native->clang-stage1-native \
    clang-stage1-native->llvm-project-source-${LLVMVERSION} \
"

# Keep the training-only recipes out of downstream sysroots: the
# stage1 rungs collide with the real gcc-cross's libc-free layout,
# and the producers are consumed by their direct dependents only
# (direct DEPENDS bypass this). Same convention as oe-core's
# ".*->.*-initial.*" (commit 6706bad52f93):
# https://git.openembedded.org/openembedded-core/commit/?id=6706bad52f9311ea79c534ee90014c3216992999
SSTATE_EXCLUDEDEPS_SYSROOT += ".*->.*-stage1.*"
SSTATE_EXCLUDEDEPS_SYSROOT += ".*->.*-profdata-.*"
